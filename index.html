<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .btn {
    display: inline-block;
    padding: 12px 25px;
    background: #222;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    transition: 0.3s;
}
.btn:hover {
    background: #555;
    transform: translateY(-2px);
}
img{
    height: 22px;
    width: 22px;

}
        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .navbar {
            height: 275px;
            border-bottom: 1px solid #e5e5e5;

            display: flex;
            align-items: flex-end;
            padding: 0 24px 13px 24px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }

        .logo-icon {
            width: 16px;
            height: 16px;
            background-color: #111;
           
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
            margin-left: 100px;
        }

        .nav-links a {
            text-decoration: none;
            color: #111;
            font-size: 10px;
        }

        .arrow {
            font-size: 9px;
            margin-left: 4px;
            color: #777;
        }

        .right-links {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .login {
            text-decoration: none;
            color: #111;
            font-size: 10px;
        }

        .signup {
            background-color: #171717;
            color: white;
            text-decoration: none;
            font-size: 10px;

            padding: 7px 13px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <nav class="navbar">
<img src="logo.png" alt="">
        <div class="logo">
            <div class=""></div>
            
            <span>Shadcnblocks.com</span>
        </div>

        <div class="nav-links">

            <a href="#">
                Products <span class="arrow">⌄</span>
            </a>

            <a href="#">
                Company <span class="arrow">⌄</span>
            </a>

            <a href="#">Contact</a>

        </div>

        <div class="right-links">

            <a href="#" class="login">Log in</a>

            <a href="#" class="signup">Sign up</a>

        </div>

    </nav>
<nav>
