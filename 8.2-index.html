<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Navbar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2864b5, #07143e, #24135d);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 120px;
        }

        /* Navbar */
        .navbar {
            width: 80%;
            max-width: 960px;
            height: 86px;
            padding: 0 30px;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 20px;

            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(12px);

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

       
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .logo-circle {
            width: 29px;
            height: 29px;
            border-radius: 50%;
            background: linear-gradient(135deg, #35c9ff, #687eff);
        }

      
        .nav-links {
            display: flex;
            gap: 38px;
            list-style: none;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #51caff;
        }

       
        .signup {
            padding: 15px 27px;
            border-radius: 14px;
            border: none;

            background: linear-gradient(135deg, #35c9ff, #7780ef);
            color: white;

            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .signup:hover {
            opacity: 0.85;
        }

       
        .menu-icon {
            display: none;
            font-size: 34px;
            color: white;
            cursor: pointer;
        }

        
        @media (max-width: 700px) {

            body {
                padding-top: 120px;
            }

            .navbar {
                width: 70%;
                height: 75px;
                padding: 0 25px;
            }

            .nav-links,
            .signup {
                display: none;
            }

            .menu-icon {
                display: block;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
 <div class="logo">
            <div class="logo-circle"></div>
            <span>Flow</span>
        </div>
        
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Product</a></li>
            <li><a href="#">Docs</a></li>
            <li><a href="#">Blog</a></li>
        </ul>

        <button class="signup">Sign up</button>

        <div class="menu-icon">
            ☰
        </div>

    </nav>

</body>
</html>
